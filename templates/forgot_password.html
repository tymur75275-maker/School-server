<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скинути пароль</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>Відновлення пароля</h2>
        <p class="auth-subtitle">Введіть вашу електронну пошту, і ми надішлемо посилання для скидання пароля.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('forgot_password') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <button type="submit" class="btn btn-primary">Надіслати інструкції</button>
        </form>

        <div class="auth-footer">
            <p>Згадали пароль? <a href="{{ url_for('login') }}">Увійти</a></p>
        </div>
    </div>
</body>
</html>
