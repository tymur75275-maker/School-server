<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Встановлення нового пароля</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>Новий пароль</h2>
        <p class="auth-subtitle">Введіть новий пароль для вашого облікового запису.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="password">Новий пароль</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm_password">Підтвердіть новий пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary">Зберегти новий пароль</button>
        </form>
    </div>
</body>
</html>
